name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: workforceguard
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: workforceguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workforceguard"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgresql+asyncpg://workforceguard:ci-only@localhost:5432/workforceguard
      MCP_DATABASE_URL: postgresql+asyncpg://mcp_server:ci-only-mcp-password@localhost:5432/workforceguard
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: make lint-backend
      - run: make test-backend
      - run: make seed
      - run: make mcp-user
      - name: Eval gate (rule F1 vs evals/baselines.json)
        run: |
          status=0
          make eval || status=$?
          cat evals/report.md >> "$GITHUB_STEP_SUMMARY"
          exit $status

  judge:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      LLM_BASE_URL: http://localhost:11434/v1
      LLM_MODEL: qwen3:4b
      LLM_TIMEOUT_SECONDS: 180
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - id: ollama-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.ollama/models
          key: ollama-qwen3-4b-0.40.0
      - name: Start Ollama
        run: |
          mkdir -p "$HOME/.ollama/models"
          docker run -d --name ollama -p 11434:11434 -v "$HOME/.ollama/models:/root/.ollama/models" ollama/ollama:0.40.0
          for _ in $(seq 60); do
            curl -sf http://localhost:11434/api/tags > /dev/null && exit 0
            sleep 1
          done
          echo "Ollama did not start within 60 s" && exit 1
      - run: docker exec ollama ollama pull qwen3:4b
      - run: sudo chown -R "$USER" "$HOME/.ollama"
      - uses: actions/cache/save@v4
        if: steps.ollama-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.ollama/models
          key: ollama-qwen3-4b-0.40.0
      - name: Judge gate (explanation score vs evals/baselines.json)
        run: |
          status=0
          make eval-judge || status=$?
          cat evals/judge_report.md >> "$GITHUB_STEP_SUMMARY"
          exit $status

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: make lint-frontend
      - run: make test-frontend
