name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: workforceguard
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: workforceguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workforceguard"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgresql+asyncpg://workforceguard:ci-only@localhost:5432/workforceguard
      MCP_DATABASE_URL: postgresql+asyncpg://mcp_server:ci-only-mcp-password@localhost:5432/workforceguard
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: make lint-backend
      - run: make test-backend
      - run: make seed
      - run: make mcp-user
      - name: Eval gate (rule F1 vs evals/baselines.json)
        run: |
          status=0
          make eval || status=$?
          cat evals/report.md >> "$GITHUB_STEP_SUMMARY"
          exit $status

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: make lint-frontend
      - run: make test-frontend
