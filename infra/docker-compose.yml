name: workforceguard

services:
  postgres:
    # pgvector image = Postgres 16 plus the vector extension needed for RAG later.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-workforceguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workforceguard}
      POSTGRES_DB: ${POSTGRES_DB:-workforceguard}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30

  ollama:
    image: ollama/ollama:0.40.0
    profiles: ["llm"]
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
  ollama-data:
